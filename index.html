<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7a1f1f" />
    <meta name="description" content="Stock & Foil: a tamper-proof paper work record that both worker and employer hold, verified with a phone camera. Works offline." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Stock &amp; Foil — the tally stick, resurrected</title>
    <style>
      /* opening loader: shows at once, flies into the header when the app is ready (see src/ui/splash.ts) */
      #splash { --sp-bg: #1b1712; position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; color: #f4ead2; transition: opacity .45s ease; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', Georgia, serif; }
      #splash::before { content: ''; position: absolute; inset: 0; background: var(--sp-bg); transition: opacity .7s .12s ease; }
      @media (prefers-color-scheme: light) { #splash { --sp-bg: #f4ead2; color: #231710; } }
      #splash .sp-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      #splash .sp-brand { display: flex; align-items: center; gap: 29px; transform-origin: 0 0; will-change: transform; }
      #splash .sp-brand svg { width: 106px; height: 106px; filter: drop-shadow(0 0 22px rgba(194, 70, 40, .55)); animation: spPop .9s cubic-bezier(.2, .9, .3, 1.2) both; }
      #splash .sp-wm { display: flex; flex-direction: column; gap: 3px; line-height: 1; animation: spRise .8s .15s cubic-bezier(.2, .9, .3, 1) both; }
      #splash .sp-wm b { display: block; font-size: 2.7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      #splash .sp-wm b + svg + b { font-size: 2.35rem; letter-spacing: .2em; color: #c8574a; }
      #splash .sp-wm svg { display: block; width: 100%; height: 17px; margin: 3px 0; color: currentColor; opacity: .5; }
      #splash .sp-tag { font: 600 .78rem system-ui, sans-serif; letter-spacing: .38em; text-transform: uppercase; opacity: .55; animation: spFade 1s .5s ease both; transition: opacity .35s; }
      #splash .sp-bar { width: 250px; height: 2px; border-radius: 2px; background: rgba(128, 120, 108, .28); overflow: hidden; transition: opacity .35s; }
      #splash .sp-bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #c8574a, #ffb27a); animation: spLoad 1.6s .2s cubic-bezier(.2, .7, .2, 1) forwards; }
      #splash.done .sp-bar i { animation: none; width: 100%; transition: width .3s ease; }
      #splash.merge::before { opacity: 0; }
      #splash.merge .sp-tag, #splash.merge .sp-bar { opacity: 0; }
      #splash.merge .sp-brand { transition: transform .95s cubic-bezier(.65, 0, .25, 1); }
      #splash.gone { opacity: 0; }
      body.splashing .top .brand { opacity: 0; }
      body .top .brand { transition: opacity .25s; }
      @keyframes spPop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes spRise { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
      @keyframes spFade { from { opacity: 0; } to { opacity: .55; } }
      @keyframes spLoad { to { width: 88%; } }
      @media (max-width: 520px) { #splash .sp-brand { gap: 18px; } #splash .sp-brand svg { width: 70px; height: 70px; } #splash .sp-wm b { font-size: 1.8rem; } #splash .sp-wm b + svg + b { font-size: 1.55rem; } #splash .sp-wm svg { height: 12px; } #splash .sp-bar { width: 190px; } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } #splash .sp-bar i { width: 88%; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-wrap">
        <div class="sp-brand">
          <svg viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#7a1f1f" /><path d="M14 40 Q30 28 48 40 T82 40 V20 H14Z" fill="#f4ead2" /><path d="M14 40 Q30 28 48 40 T82 40 V76 H14Z" fill="#e6d6ad" /><circle cx="30" cy="22" r="5" fill="#7a1f1f" /><circle cx="48" cy="22" r="5" fill="#7a1f1f" /><circle cx="66" cy="22" r="5" fill="#7a1f1f" /><circle cx="30" cy="58" r="5" fill="#7a1f1f" /><circle cx="48" cy="58" r="5" fill="#7a1f1f" /><circle cx="66" cy="58" r="5" fill="#7a1f1f" /></svg>
          <div class="sp-wm"><b>Stock</b><svg viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4 Q10 0 20 4 T40 4 T60 4 T80 4 T100 4 T120 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" /></svg><b>&amp; Foil</b></div>
        </div>
        <div class="sp-tag">Cut it · Punch it · Prove it</div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>
    <script>
      // the loader plays on every load and reload
      document.body.classList.add('splashing');
      window.__sfT0 = performance.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
